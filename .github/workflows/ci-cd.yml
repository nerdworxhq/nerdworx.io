name: Nerdworx.io CI/CD Pipeline

permissions:
  contents: write
  packages: write
  pull-requests: read

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      rebuild_base:
        description: 'Rebuild the PHP base image even if it already exists in GHCR'
        type: boolean
        default: false

env:
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/nerdworx.io
  PHP_BASE_IMAGE: ghcr.io/${{ github.repository_owner }}/nerdworx.io/nerdworx-io-php-base-85:v1.0.0

jobs:
  # Builds the PHP base image the app image is FROM, but only when it isn't
  # in GHCR yet (or a manual run asks for a rebuild).
  build-base-image:
    runs-on: ubuntu-latest
    environment: nerdworx.io
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT_TOKEN }}

      - name: Check for existing base image
        id: check
        run: |
          if [ "${{ inputs.rebuild_base }}" != "true" ] && docker manifest inspect "$PHP_BASE_IMAGE" > /dev/null 2>&1; then
            echo "build=false" >> $GITHUB_OUTPUT
          else
            echo "build=true" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push PHP Base Image
        if: steps.check.outputs.build == 'true'
        run: |
          docker build . -f .docker/php/k8sbase.dockerfile -t "$PHP_BASE_IMAGE"
          docker push "$PHP_BASE_IMAGE"

  tag-nerdworx-io:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: nerdworx.io
    outputs:
      tag_created: ${{ steps.create_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT_TOKEN }}

      - name: Tag on Merge for nerdworx.io
        id: create_tag
        run: |
          export GITHUB_TAG_NERDWORX_IO=$(date "+%Y.%m.%d.%H%M%S-${GITHUB_REF_NAME}")
          git config --global user.email "jordan@jordanholton.com"
          git config --global user.name "Jordan Holton"
          git tag $GITHUB_TAG_NERDWORX_IO
          git push origin $GITHUB_TAG_NERDWORX_IO
          echo "tag=$GITHUB_TAG_NERDWORX_IO" >> $GITHUB_OUTPUT

  build-and-push:
    needs: [build-base-image, tag-nerdworx-io]
    if: needs.tag-nerdworx-io.outputs.tag_created != ''
    runs-on: ubuntu-latest
    environment: nerdworx.io
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT_TOKEN }}

      - name: Docker Build and Push
        run: |
          # Build front-end assets into public/build for the nginx image
          npm install
          npm run build

          TAG="${{ needs.tag-nerdworx-io.outputs.tag_created }}"
          # Only main moves :latest, which the cluster pulls on rollout
          if [ "$GITHUB_REF_NAME" = "main" ]; then CHANNEL=latest; else CHANNEL="$GITHUB_REF_NAME"; fi

          docker build . -f .docker/nginx/k8s.dockerfile \
            -t "$IMAGE_BASE/nerdworx-io-nginx:$TAG" \
            -t "$IMAGE_BASE/nerdworx-io-nginx:$CHANNEL"

          docker build . -f .docker/php/k8s.dockerfile \
            -t "$IMAGE_BASE/nerdworx-io-php:$TAG" \
            -t "$IMAGE_BASE/nerdworx-io-php:$CHANNEL"

          docker push "$IMAGE_BASE/nerdworx-io-nginx:$TAG"
          docker push "$IMAGE_BASE/nerdworx-io-nginx:$CHANNEL"

          docker push "$IMAGE_BASE/nerdworx-io-php:$TAG"
          docker push "$IMAGE_BASE/nerdworx-io-php:$CHANNEL"
