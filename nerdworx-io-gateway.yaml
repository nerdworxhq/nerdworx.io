apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: nerdworx-io-gateway
  namespace: nerdworx-io
spec:
  gatewayClassName: cilium
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "nerdworx.io"
      tls:
        mode: Terminate
        certificateRefs:
          - name: nerdworx-io-cert
            kind: Secret
            group: ""
      allowedRoutes:
        namespaces:
          from: Same
