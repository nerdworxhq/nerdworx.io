namespace: nerdwrks
environment: prod
deploymentNameWeb: nerdwrks-web
spec:
  replicas: 3
web:
  service:
    type: ClusterIP
    port: 443

  containerWebNginx: nerdwrks-nginx
  nginx: 
    image:
      repository: ghcr.io/nerdworxhq/nerdworx.io/nerdwrks-nginx
      tag: latest
      pullPolicy: Always
  
  containerWebPHP: nerdwrks-php
  php: 
    image:
      repository: ghcr.io/nerdworxhq/nerdworx.io/nerdwrks-php
      tag: latest
      pullPolicy: Always

imagePullSecret: registry-image-pull